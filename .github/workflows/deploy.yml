name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

# Pages for this user site serves the repository root of the `master` branch
# (legacy branch deploy). `main` holds the source; this job builds it and
# force-pushes the compiled bundle to `master`.
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist/ to master
        run: |
          cd dist
          git init
          git checkout -b master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA:0:8}"
          git push -f "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
